# CPU-oriented baseline configuration for the in-distribution synthetic study.
experiment_name: default
seed: 0

n_workers: 1               # >1 builds the mask family on a thread pool (A3)

data:
  # Synthetic images cost microseconds to generate, so the previous 36/12/12
  # split was buying nothing. At 12 test images the 90% conformal coverage
  # interval spans [0.730, 1.000] and bootstrap intervals on PSNR are wider
  # than the gaps between masks, so nothing was distinguishable. 200/100/100
  # narrows the coverage interval to roughly [0.84, 0.96] and still runs on CPU.
  n_images: 400
  image_size: 64
  n_train: 200
  n_val: 100
  n_test: 100
  phantom: ellipses        # ellipses | shepp_logan
  min_ellipses: 3
  max_ellipses: 8

measurement:
  # Std of circular complex Gaussian noise in single-coil Fourier space.
  noise_std: 0.005

mask:
  sampling_fraction: 0.25
  center_fraction: 0.02    # fraction of the point budget reserved at k-space center
  variable_density_decay: 3.0
  lines:
    n_center_lines: 2
    decay: 2.0
  multilevel:
    n_levels: 4
    decay: 1.5
  # Stable, non-learned baselines used by the default comparison. Advanced
  # greedy, subspace, and learned designs are opt-in experimental scripts.
  types:
    - uniform_random
    - variable_density
    - multilevel_random
    - multilevel_local_coherence
    - equispaced_lines
    - variable_density_lines

greedy:
  # Defaults to measurement.noise_std ** 2 unless explicitly overridden.
  beta: 1.0
  beta_sweep: [0.0, 1.0, 2.0]
  n_candidates: 8
  recon_in_loop:
    n_candidate_lines: 6
    batch_size: 4
    ista_iters: 3

# Experimental settings below are not exercised by the default comparison.
subspace:
  d: 16
  beta: 0.0
  ridge: 1.0e-6          # numerical floor for the posterior precision
  lam: null              # null -> measurement.noise_std ** 2, for design and recon
  generative:
    steps: 50
    lr: 0.05

unet_post:
  mask_type: variable_density
  epochs: 10
  batch_size: 4
  lr: 0.001
  base_channels: 8

budget_sweep:
  accelerations: [4, 8]

loupe:
  epochs: 10
  batch_size: 4
  lr: 0.001
  prob_slope: 5.0
  mask_slope: 12.0
  base_channels: 8

recon:
  ridge_lambda: 0.05
  wavelet_ista:
    threshold: 0.02
    # Monotone FISTA. At 15 plain-ISTA iterations the objective sat about
    # 4 orders of magnitude above the minimizer, which mixes solver dynamics
    # into any comparison between masks. 60 momentum iterations reach a
    # smaller gap than 150 plain ones; measured on the default family the
    # mask ranking was unchanged, so this buys correctness, not a new result.
    momentum: true
    n_iters: 60
    tol: 1.0e-6
    wavelet: db4
    levels: 3
    # With noisy measurements, exact replacement would re-inject the observed
    # noise. Set true only for a deliberately hard data-consistency projection.
    final_dc: false

outputs:
  n_examples: 3

experimental:
  include_unet_in_comparisons: false
